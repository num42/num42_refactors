name: Credo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: credo-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  credo:
    name: Credo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev

      - name: Credo (high priority only)
        env:
          MIX_ENV: dev
        run: mix credo --min-priority=high
